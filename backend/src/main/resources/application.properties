server.port=8080

# Teams configure ONLY application-local.properties (gitignored).
# Copy application-local.properties.example and fill in URLs / tokens.
spring.config.import=optional:classpath:application-local.properties

# ── Defaults (overridden by application-local.properties) ─────────────────────
jira.base-url=
jira.api-path=/rest/api/3
jira.auth-type=basic
jira.username=
jira.api-token=
jira.bearer-token=
jira.custom-fields.acceptance-criteria=
jira.custom-fields.linked-stories=

zephyr.provider=jira-plugin
zephyr.jira-plugin-api-path=/rest/atm/1.0
zephyr.tests-api-path=/rest/tests/1.0
zephyr.tm4j-backend-base-url=https://eu.app.tm4j.smartbear.com/backend
zephyr.scale-cloud-base-url=https://api.zephyrscale.smartbear.com/v2
zephyr.scale-cloud-api-token=
zephyr.default-project-id=
zephyr.default-project-key=
zephyr.default-test-run-status-id=0
zephyr.known-folders=

# Used when zephyr.provider=scale-cloud, or whenever a Scale JWT is set.
# Jira API tokens cannot list Zephyr Scale Cloud folders.
zephyr.default-test-case-status=Approved
zephyr.default-priority=Normal

ai.provider=gemini
ai.temperature=0.7
ai.frequency-penalty=0.0
